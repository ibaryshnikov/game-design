[package]
name = "editor"
version = "0.1.0"
authors = ["ibaryshnikov"]
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.iced]
version = "0.14"
default-features = false
features = ["advanced", "tokio", "wgpu", "x11"]

[dependencies.iced_widget]
version = "0.14"

[dependencies.iced_winit]
version = "0.14"

[dependencies.tokio]
version = "1.49"
features = ["rt-multi-thread"]

[dependencies.shared]
path = "../shared"
